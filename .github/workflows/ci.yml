name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Python syntax
        run: python -m compileall -q tools test
      - name: Whitespace
        run: git diff --check
      - name: Version consistency
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          hdr = Path("kernel/include/potato.h").read_text(encoding="utf-8")
          m = re.search(r'POTATO_VERSION\s+"([^"]+)"', hdr)
          assert m, "POTATO_VERSION not found"
          ver = m.group(1)
          assert re.fullmatch(r"\d+\.\d+\.\d+", ver), ver
          for name in ("README.md", "README.en.md"):
              assert f"v{ver}" in Path(name).read_text(encoding="utf-8"), name
          assert f"## [{ver}]" in Path("CHANGELOG.md").read_text(encoding="utf-8")
          print("version consistency OK:", ver)
          PY
      - name: fetch_deps pins
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          src = Path("tools/fetch_deps.py").read_text(encoding="utf-8")
          pins = re.findall(r'^(?:TOOLCHAIN|QEMU)_SHA256\s*=\s*"([0-9a-f]{64})"',
                            src, re.M)
          assert len(pins) == 2, pins
          print("fetch_deps SHA256 pins OK")
          PY

  qemu-gate:
    name: QEMU gate (build + 2 rounds)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Cache pinned toolchain + QEMU
        uses: actions/cache@v6
        with:
          path: third_party
          key: ${{ runner.os }}-deps-${{ hashFiles('tools/envlib.py', 'tools/fetch_deps.py') }}
      - name: Fetch pinned toolchain + QEMU (SHA256 verified)
        run: python tools/fetch_deps.py
      - name: Environment check
        run: python tools/check_env.py
      - name: Clean build
        run: python tools/build.py --clean
      - name: Release gate (two QEMU rounds)
        run: python tools/release_gate.py --rounds 2 --skip-build
      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-gate-logs
          path: |
            build/_gate_*.log
            test/logs/*.error.log
          retention-days: 7
