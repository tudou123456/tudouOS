name: Feature request / 功能建议
description: 提出新功能、移植或改进建议
title: "[feat] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        先说明**场景与验收标准**，比直接给实现方案更有帮助。
        大改动建议先在 Discussions 里讨论。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不够用？影响谁？有替代方案吗？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: API/命令/协议/数据结构草图；是否涉及 ABI/兼容性
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 希望用什么用例/指标证明完成（QEMU/真机/长稳）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 领域
      options:
        - 内核/调度/中断
        - 内存/文件系统
        - 消息/MCP
        - 网络/以太网
        - SMP
        - 可观测/工具
        - 文档/构建/CI
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
    validations:
      required: false
